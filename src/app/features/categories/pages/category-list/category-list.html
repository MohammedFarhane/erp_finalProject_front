<div>
  <header class="doc-header">
    <h1 class="doc-title">Catégories</h1>
    <span class="spacer"></span>
    @if (isAdmin()) {
      <button matButton="filled" type="button" (click)="openForm(null)">
        <mat-icon>add</mat-icon> Nouvelle catégorie
      </button>
    }
  </header>

  @if (errorMessage()) {
    <p class="doc-error">{{ errorMessage() }}</p>
  }

  <table mat-table [dataSource]="categories.value()" class="doc-table">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let category">{{ category.name }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="align-right"></th>
      <td mat-cell *matCellDef="let category" class="align-right">
        @if (isAdmin()) {
          <button matIconButton type="button" aria-label="Modifier" (click)="openForm(category)">
            <mat-icon>edit_note</mat-icon>
          </button>
          <button matIconButton type="button" aria-label="Supprimer" (click)="remove(category)">
            <mat-icon>delete</mat-icon>
          </button>
        }
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>

  @if (categories.value().length === 0) {
    <p class="doc-empty">Aucune catégorie.</p>
  }
</div>
