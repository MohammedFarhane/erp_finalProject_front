<h2 mat-dialog-title>
  {{ data.category ? 'Modifier la catégorie' : 'Nouvelle catégorie' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="form">
    <mat-form-field style="min-width: 20rem">
      <mat-label>Nom</mat-label>
      <input matInput formControlName="name" cdkFocusInitial />
      <mat-error>Le nom est Obligatoire</mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="text" mat-dialog-close>Annuler</button>
  <button matButton="filled" [disabled]="form.invalid" [mat-dialog-close]="form.getRawValue()">
    {{ data.category ? 'Enregister' : 'Créer' }}
  </button>
</mat-dialog-actions>
