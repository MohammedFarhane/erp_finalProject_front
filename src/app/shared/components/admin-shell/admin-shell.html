<mat-toolbar class="shell-toolbar">
  <span class="shell-brand">ERP</span>

  <span class="shell-spacer"></span>

  @if (user(); as connected) {
    <span class="shell-email">{{ connected.email }}</span>
  }

  <button matButton="text" type="button" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Déconnexion
  </button>
</mat-toolbar>

<div class="shell-body">
  <nav class="shell-nav">
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="shell-link-active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Tableau de bord</span>
      </a>

      <a mat-list-item routerLink="/quotes" routerLinkActive="shell-link-active">
        <mat-icon matListItemIcon>request_quote</mat-icon>
        <span matListItemTitle>Devis</span>
      </a>

      <a mat-list-item routerLink="/billings" routerLinkActive="shell-link-active">
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Factures</span>
      </a>

      <a mat-list-item routerLink="/purchase-orders" routerLinkActive="shell-link-active">
        <mat-icon matListItemIcon>local_shipping</mat-icon>
        <span matListItemTitle>Commandes</span>
      </a>
      <!-- À décommenter au fur et à mesure que les écrans existent.
        <a mat-list-item routerLink="/products" routerLinkActive="shell-link-active">
          <mat-icon matListItemIcon>inventory_2</mat-icon>
          <span matListItemTitle>Produits</span>
        </a>

        <a mat-list-item routerLink="/clients" routerLinkActive="shell-link-active">
          <mat-icon matListItemIcon>groups</mat-icon>
          <span matListItemTitle>Clients</span>
        </a>

        <a mat-list-item routerLink="/suppliers" routerLinkActive="shell-link-active">
          <mat-icon matListItemIcon>factory</mat-icon>
          <span matListItemTitle>Fournisseurs</span>
        </a>

        <a mat-list-item routerLink="/categories" routerLinkActive="shell-link-active">
          <mat-icon matListItemIcon>category</mat-icon>
          <span matListItemTitle>Catégories</span>
        </a>

        @if (isAdmin()) {
          <a mat-list-item routerLink="/users" routerLinkActive="shell-link-active">
            <mat-icon matListItemIcon>manage_accounts</mat-icon>
            <span matListItemTitle>Utilisateurs</span>
          </a>
        }-->
    </mat-nav-list>
  </nav>

  <main class="shell-content">
    <router-outlet />
  </main>
</div>
