<h2 matDialogTitle>{{data.title}}</h2>

<mat-dialog-content>
  <p>{{data.message}}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="text" [mat-dialog-close]="false" cdkFocusInitial>Annuler</button>
  <button matButton="filled" [mat-dialog-close]="true">
    {{data.confirmLabel ?? 'Confirmer'}}
  </button>
</mat-dialog-actions>
